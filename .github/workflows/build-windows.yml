# Compilation reproductible sur un vrai Windows (GitHub Actions).
# Déclenchement : chaque envoi sur « main », chaque étiquette v* (publie aussi une version
# téléchargeable dans l'onglet « Releases »), ou manuellement depuis l'onglet « Actions ».
name: Compilation Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Compiler l'installeur et la version portable
        run: npm run dist:win

      - name: Vérifier les fichiers produits
        run: npm run verify:release

      - uses: actions/upload-artifact@v4
        with:
          name: MonBureauIntelligent-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publier la version (étiquettes v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MonBureauIntelligent-Setup-*.exe
            release/MonBureauIntelligent-Portable-*.exe
          generate_release_notes: true
